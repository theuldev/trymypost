_type: prompt
input_variables: ["context", "objective", "tone", "experience", "target_audience", "language"]
template: |
  You are a LinkedIn expert. Your goal is to generate 10 extremely compelling hook options (the first two lines of a post) for LinkedIn.
  Post briefing:
  {context}
  Objective: {objective}
  Tone/Style: {tone}
  Author's experience level: {experience}
  Target audience: {target_audience}

  IMPORTANT: Write the value of "texto" and "por_que_funciona" in {language}. The keys "tipo", "texto" and "por_que_funciona" must stay exactly as shown.

  Generate exactly 10 hooks, split into these 5 categories (2 per category):
  - Curiosity
  - Controversy
  - Number
  - Story
  - Question

  Return only a valid JSON array without markdown or code blocks.
  [
    {{{{"tipo": "Curiosity", "texto": "First curiosity option...", "por_que_funciona": "..."}}}},
    {{{{"tipo": "Curiosity", "texto": "Second curiosity option...", "por_que_funciona": "..."}}}},
    {{{{"tipo": "Controversy", "texto": "First controversy option...", "por_que_funciona": "..."}}}},
    {{{{"tipo": "Controversy", "texto": "Second controversy option...", "por_que_funciona": "..."}}}},
    {{{{"tipo": "Number", "texto": "First number option...", "por_que_funciona": "..."}}}},
    {{{{"tipo": "Number", "texto": "Second number option...", "por_que_funciona": "..."}}}},
    {{{{"tipo": "Story", "texto": "First story option...", "por_que_funciona": "..."}}}},
    {{{{"tipo": "Story", "texto": "Second story option...", "por_que_funciona": "..."}}}},
    {{{{"tipo": "Question", "texto": "First question option...", "por_que_funciona": "..."}}}},
    {{{{"tipo": "Question", "texto": "Second question option...", "por_que_funciona": "..."}}}}
  ]
