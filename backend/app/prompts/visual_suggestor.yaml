_type: prompt
input_variables: ["topic", "post_content"]
template: |
  Based on the topic "{topic}" and the post content "{post_content}", suggest visual ideas to accompany the post on LinkedIn.

  Return only a valid JSON object without markdown or code blocks in the following format:
  {{
    "tipo_conteudo": "Type of visual content (e.g.: Carousel, Single Image, Infographic, Short Video)",
    "descricao_visual": "Detailed description of the suggested visual identity",
    "ferramentas_sugeridas": ["tool1", "tool2", "tool3"],
    "dicas_composicao": ["tip1", "tip2", "tip3", "tip4"],
    "codigo_exemplo": "If the post contains a markdown code block (starting with ```), extract and return that exact code here. Otherwise, return null. Do not include comments in the code.",
    "codigo_linguagem": "The corresponding language of the extracted code (e.g.: javascript, typescript, csharp, python, sql, html, css, java, go, rust, json) or null"
  }}
