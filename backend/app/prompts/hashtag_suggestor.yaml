_type: prompt
input_variables: ["post_content", "brand"]
template: |
  Analyze the following technical LinkedIn post:
  "{post_content}"

  Suggest hashtags split into 3 categories:
  1. Popular (general high-reach hashtags, e.g.: #SoftwareEngineering, #Backend)
  2. Niche (hashtags specific to the technology addressed, e.g.: #Docker, #Python, #AsyncAwait)
  3. Brand (hashtags related to the brand "{brand}" if provided, or generic tech brand hashtags like #TryMyPost, #DevLife)

  Return only a valid JSON object without markdown or code blocks in the exact format:
  {{
    "populares": ["#tag1", "#tag2", "#tag3"],
    "nicho": ["#tag4", "#tag5", "#tag6"],
    "marca": ["#tag7", "#tag8", "#tag9"]
  }}
