_type: prompt
input_variables: ["topic"]
template: |
  You are a senior Software Architect. Your task is to create a deep technical briefing about "{topic}" to feed a content creator.

  The briefing should contain:
  1. A REAL CONFLICT: A common mistake, a performance bottleneck, or a conceptual confusion that developers face with {topic}.
  2. THE TECHNICAL SOLUTION: How to resolve this conflict using best practices.
  3. "DEEP DIVE" CONCEPTS: 3 specific technical points (e.g.: internal workings, flags, libraries, advanced syntax).
  4. A STRONG OPINION: A controversial view or a trend on how {topic} should (or shouldn't) be used day-to-day.

  Return only the technical information in bullet points, with no introductions.
