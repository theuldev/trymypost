services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: trymypost-rabbitmq
    hostname: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: trymypost
      RABBITMQ_DEFAULT_PASS: trymypost

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - trymypost-network


  redis:
    image: redis:7-alpine
    container_name: trymypost-redis
    hostname: redis

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped

    networks:
      - trymypost-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trymypost-backend
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://trymypost:trymypost@rabbitmq:5672/
    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    depends_on:
      rabbitmq:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    networks:
      - trymypost-network


  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: trymypost-worker

    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://trymypost:trymypost@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0

    volumes:
      - ./backend:/app

    depends_on:
      rabbitmq:
        condition: service_healthy

    command: ["python", "run_worker.py"]

    restart: unless-stopped

    networks:
      - trymypost-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: trymypost-frontend

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - trymypost-network


volumes:
  rabbitmq_data:
  redis_data:

networks:
  trymypost-network:
    driver: bridge