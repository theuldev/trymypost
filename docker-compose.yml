version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trymypost-backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./trymypost.db
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - DEBUG=true
    volumes:
      - backend_data:/app
      - ./backend/prompts:/app/prompts:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - trymypost-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trymypost-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - trymypost-network

volumes:
  backend_data:

networks:
  trymypost-network:
    driver: bridge